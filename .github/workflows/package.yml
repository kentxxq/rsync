name: 打包 Windows rsync

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'build-*'

permissions:
  contents: read

jobs:
  package:
    name: 获取官方组件并打包
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 组装便携包与对应源码
        run: uv run --python 3.12 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify:
    name: Windows 解压与运行测试
    needs: package
    uses: ./.github/workflows/verify.yml

  release:
    name: 发布 GitHub Release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rsync-portable-windows-x64
          path: dist
      - name: 上传便携包、源码与校验文件并发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EVENT" == "push" ]]; then
            tag="$RELEASE_REF"
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          mkdir -p debug
          cat > debug/tmpfile-AI-release-notes.md <<'EOF'
          Windows x64 便携版 rsync，已通过压缩包校验和 Windows 基本启动检查。

          - 使用：下载并解压 rsync-portable-windows-x64.zip，保留整个文件夹。
          - 对应源码：corresponding-sources.zip，包含上游源码包和本次构建材料。
          - 校验：SHA256SUMS。

          组件的具体版本与校验值见便携包内的 components.lock.json。分发时请同时提供对应源码与许可。
          EOF
          # 先作为草稿上传全部附件，完成后再公开发布。
          gh release create "$tag" \
            dist/rsync-portable-windows-x64.zip \
            dist/corresponding-sources.zip \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Windows rsync $tag" \
            --notes-file debug/tmpfile-AI-release-notes.md \
            --draft
          gh release edit "$tag" --draft=false --latest
